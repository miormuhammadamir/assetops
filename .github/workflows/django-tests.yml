name: Django Tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python manage.py check
        env:
          DJANGO_DEBUG: '1'
          DJANGO_SECRET_KEY: ci-only-do-not-use-for-production
      - run: python manage.py makemigrations --check --dry-run
        env:
          DJANGO_DEBUG: '1'
          DJANGO_SECRET_KEY: ci-only-do-not-use-for-production
      - run: python manage.py test
        env:
          DJANGO_DEBUG: '1'
          DJANGO_SECRET_KEY: ci-only-do-not-use-for-production
